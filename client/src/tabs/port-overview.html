    <div id="page-port-overview" class="page">
      <div id="portErrorBox" class="error" style="display:none"></div>

      <!-- Account cards -->
      <section>
        <div class="section-title" data-i18n="app:portOverview.accountTitle">Account Overview</div>
        <div class="cards">
          <div class="card"><div class="card-label" data-i18n="app:portOverview.cardEquity">Equity</div><div class="card-value" id="portStatEquity"><span class="spinner"></span></div></div>
          <div class="card"><div class="card-label" data-i18n="app:portOverview.cardCash">Cash</div><div class="card-value" id="portStatCash"></div></div>
          <div class="card"><div class="card-label" data-i18n="app:portOverview.cardBP">Buying Power</div><div class="card-value" id="portStatBP"></div></div>
          <div class="card"><div class="card-label" data-i18n="app:portOverview.cardPortfolioValue">Portfolio Value</div><div class="card-value" id="portStatPortfolio"></div></div>
          <div class="card"><div class="card-label" data-i18n="app:portOverview.cardUnrealizedPnl">Unrealized P&amp;L</div><div class="card-value" id="portStatUnrealPL"></div><div class="card-sub" id="portStatUnrealPct"></div></div>
          <div class="card"><div class="card-label" data-i18n="app:portOverview.cardDayPnl">Today's P&amp;L</div><div class="card-value" id="portStatDayPL"></div><div class="card-sub" id="portStatDayPct"></div></div>
        </div>
      </section>

      <!-- Portfolio chart -->
      <section>
        <div class="chart-card">
          <div class="chart-header">
            <div>
              <div class="chart-title" data-i18n="app:portOverview.chartTitle">Portfolio Performance</div>
              <div class="chart-meta" id="portChartMeta">—</div>
            </div>
            <div class="period-btns">
              <button class="port-period-btn"        data-p="1D" data-tf="5Min" onclick="portChangePeriod(this)" data-i18n="app:portOverview.period1D">1D</button>
              <button class="port-period-btn"        data-p="1W" data-tf="1H"   onclick="portChangePeriod(this)" data-i18n="app:portOverview.period1W">1W</button>
              <button class="port-period-btn active" data-p="1M" data-tf="1D"   onclick="portChangePeriod(this)" data-i18n="app:portOverview.period1M">1M</button>
              <button class="port-period-btn"        data-p="3M" data-tf="1D"   onclick="portChangePeriod(this)" data-i18n="app:portOverview.period3M">3M</button>
              <button class="port-period-btn"        data-p="1A" data-tf="1D"   onclick="portChangePeriod(this)" data-i18n="app:portOverview.period1Y">1Y</button>
            </div>
          </div>
          <div class="chart-canvas-wrap">
            <canvas id="portPortfolioChart"></canvas>
          </div>
        </div>
      </section>

      <!-- Open Positions -->
      <!-- NOTE: the section title's "(<span id="portPosCount">)" is left
           untranslated as a template — tabs-portfolio.js writes the live
           count into that span via textContent after load, and re-running
           applyDomI18n on a language switch would otherwise reset it to the
           static placeholder. Only the static "Open Positions" word would
           need translation but splitting it out from the count would change
           this file's structure more than this pass warrants; see report. -->
      <section>
        <div class="section-title">Open Positions (<span id="portPosCount">–</span>)</div>
        <div class="table-wrap">
          <table>
            <thead id="portPosHead"><tr>
              <th class="port-sortable"       data-key="symbol"                 data-tip="Trading pair symbol" data-i18n-tip="app:portOverview.thSymbolTip" onclick="portSortPos('symbol')"><span data-i18n="app:portOverview.thSymbol">Symbol</span> <span class="sort-icon">⇅</span></th>
              <th class="port-sortable right" data-key="qty"                    data-tip="Number of units held" data-i18n-tip="app:portOverview.thQtyTip" onclick="portSortPos('qty')"><span data-i18n="app:portOverview.thQty">Qty</span> <span class="sort-icon">⇅</span></th>
              <th class="port-sortable right" data-key="avg_entry_price"        data-tip="Average cost per unit when position was opened" data-i18n-tip="app:portOverview.thEntryPriceTip" onclick="portSortPos('avg_entry_price')"><span data-i18n="app:portOverview.thEntryPrice">Entry Price</span> <span class="sort-icon">⇅</span></th>
              <th class="port-sortable right" data-key="current_price"          data-tip="Latest market price per unit" data-i18n-tip="app:portOverview.thCurrentPriceTip" onclick="portSortPos('current_price')"><span data-i18n="app:portOverview.thCurrentPrice">Current Price</span> <span class="sort-icon">⇅</span></th>
              <th class="port-sortable right" data-key="market_value"           data-tip="Current market value (qty × current price)" data-i18n-tip="app:portOverview.thMarketValueTip" onclick="portSortPos('market_value')"><span data-i18n="app:portOverview.thMarketValue">Market Value</span> <span class="sort-icon">⇅</span></th>
              <th class="port-sortable right" data-key="unrealized_pl"          data-tip="Unrealized profit/loss in dollars" data-i18n-tip="app:portOverview.thUnrealizedPnlTip" onclick="portSortPos('unrealized_pl')"><span data-i18n="app:portOverview.thUnrealizedPnl">Unrealized P&amp;L</span> <span class="sort-icon">⇅</span></th>
              <th class="port-sortable right" data-key="unrealized_plpc"        data-tip="Unrealized P&L as % of cost basis" data-i18n-tip="app:portOverview.thUnrealizedPctTip" onclick="portSortPos('unrealized_plpc')"><span data-i18n="app:portOverview.thUnrealizedPct">Unrealized %</span> <span class="sort-icon">⇅</span></th>
              <th class="port-sortable right" data-key="unrealized_intraday_pl" data-tip="Today's profit/loss since session open" data-i18n-tip="app:portOverview.thTodayPnlTip" onclick="portSortPos('unrealized_intraday_pl')"><span data-i18n="app:portOverview.thTodayPnl">Today P&amp;L</span> <span class="sort-icon">⇅</span></th>
              <th data-tip="Open a paper limit-order ticket for this symbol" data-i18n-tip="app:portOverview.thTradeTip" data-i18n="app:portOverview.thTrade">Trade</th>
            </tr></thead>
            <tbody id="portPositionsBody">
              <tr><td colspan="9" class="placeholder"><span class="spinner"></span> <span data-i18n="app:portOverview.loadingPositions">Loading positions…</span></td></tr>
            </tbody>
          </table>
        </div>
      </section>

    </div><!-- /page-port-overview -->
